---
layout: default
---

<article class="post">
  <div style="margin-bottom: 24px;">
    <a href="{{ site.baseurl }}/" style="font-size: 0.9rem; color: var(--text-muted);">← 목록으로 돌아가기</a>
  </div>

  <header class="post-header" style="margin-bottom: 32px;">
    <div style="margin-bottom: 12px;">
      {% for tag in page.tags %}
        <span class="badge">{{ tag }}</span>
      {% endfor %}
    </div>
    <h1 style="font-size: 2.1rem; line-height: 1.3; margin-bottom: 14px;">{{ page.title }}</h1>
    <div style="color: var(--text-muted); font-size: 0.92rem; display: flex; gap: 16px;">
      <span>📅 {{ page.date | date: "%Y년 %m월 %d일" }}</span>
      <span>✍️ {{ page.author | default: site.author }}</span>
    </div>
  </header>

  <div class="post-content">
    {{ content }}
  </div>

  <div style="margin-top: 50px; padding: 20px; background: var(--card-bg); border-radius: 8px; border: 1px solid var(--border);">
    <h4 style="margin-top: 0; color: #fff;">🎬 이 논문의 60초 쇼츠 영상</h4>
    <p style="font-size: 0.95rem; color: var(--text-muted); margin-bottom: 0;">
      유튜브 쇼츠 / 인스타그램 릴스에서 본 논문의 60초 핵심 요약 영상을 만나보실 수 있습니다.
    </p>
  </div>
</article>
