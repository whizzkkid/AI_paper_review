# ─────────────────────────────────────────────────────────────
#  AI Paper Review 자동화 파이프라인 설정
#  (값을 바꾼 뒤 커밋하면 다음 실행부터 반영됩니다)
# ─────────────────────────────────────────────────────────────

site:
  base_url: "https://whizzkkid.github.io/AI_paper_review"  # 블로그 주소 (쇼츠 설명란 링크에 사용)
  channel_name: "AI 논문 60초"                            # 영상 상단 브랜드 문구
  author: "신동환"
  default_visibility: "unlisted"   # 새 글 공개 범위: unlisted(링크만 아는 사람) | public(목록 노출)

claude:
  model: "claude-opus-5-5"   # 리뷰 작성 모델
  effort: "high"             # low | medium | high | xhigh | max
  max_tokens: 64000

discovery:
  lookback_days: 10          # Hugging Face Daily Papers를 며칠 전까지 훑을지
  candidates: 120            # 업보트 상위 몇 편까지 학회 채택 여부를 확인할지
  min_upvotes: 15            # 이 업보트 미만은 후보에서 제외
  venue_policy: "prefer"     # prefer: 학회 채택 논문 우선 / require: 학회 논문만 / ignore: 업보트만
  venue_multiplier: 2.0      # 본 학회(main track) 채택 논문 점수 가중치
  workshop_multiplier: 1.2   # 워크숍 논문 점수 가중치
  exclude_title_keywords: ["survey", "position:"]   # 제목에 포함되면 제외 (소문자 비교)

video:
  width: 1080
  height: 1920
  fps: 30
  tts: "edge"                # edge(무료, MS Edge 음성) | gcloud(Google Cloud TTS, GOOGLE_TTS_API_KEY 필요) | silent(테스트용)
  voice: "ko-KR-InJoonNeural"   # edge: ko-KR-InJoonNeural(남) / ko-KR-SunHiNeural(여) / ko-KR-HyunsuMultilingualNeural
  gcloud_voice: "ko-KR-Chirp3-HD-Charon"
  rate: "+12%"               # 말하기 속도
  max_seconds: 59            # 이 길이를 넘으면 음성을 자동으로 빠르게(최대 1.25배) 맞춤
  bgm: ""                    # 배경음악 mp3 경로 (예: assets/bgm/tech.mp3). 비우면 BGM 없음. 저작권 free 음원만!
  bgm_volume: 0.07

broll:                       # AI 생성 B-roll 영상 (쇼츠의 훅·비유 장면 배경) — Higgsfield
  enabled: false             # true로 바꾸고 GitHub Secret HF_KEY("키:시크릿")를 등록하면 자동 생성
  model: "wan/v2.7/text-to-video"   # Higgsfield API 엔드포인트 (세로 9:16 지원)
  resolution: "720p"
  duration: 6                # 초 (2~15). 영상보다 장면이 길면 마지막 프레임에서 천천히 줌
  max_per_short: 2           # 쇼츠 1편당 최대 개수 (비용 관리)

youtube:
  enabled: false             # 첫 쇼츠를 다듬는 동안 업로드 중지. 준비되면 true로
  privacy: "public"          # public | unlisted | private  (승인 후 업로드 시 적용)
  category_id: "28"          # 28 = Science & Technology
  made_for_kids: false
  contains_synthetic_media: true   # AI 음성/생성 콘텐츠 고지
  default_language: "ko"
