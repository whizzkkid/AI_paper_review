# PR에서 글(.md)·쇼츠 대본(.yml)을 고치면 형식을 자동 점검합니다 (배포 X)
name: "검사: 글·쇼츠 대본 형식"

on:
  pull_request:
    paths:
      - "_posts/**"
      - "shorts/**"
      - "pipeline/**"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "PyYAML>=6.0"
      - run: python -m pipeline.check
