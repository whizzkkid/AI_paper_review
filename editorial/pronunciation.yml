# 읽는 법 사전 — 자막(narration)에는 왼쪽 원문 표기를 쓰고, AI 음성은 오른쪽처럼 읽습니다.
# 음성이 영어 이름을 이상하게 읽으면 여기에 한 줄 추가하세요. (논문 하나에만 쓰는 이름은 shorts/*.yml의 pronunciation:)
