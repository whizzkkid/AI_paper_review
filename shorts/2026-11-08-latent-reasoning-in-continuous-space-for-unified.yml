facts:
- claim: 기존 UMM은 추론 예산을 늘려도 성능이 매끄럽게 오르지 않는다
  evidence_quote: 'prior UMMs fail to scale at test time: unlike in LLMs, increasing the reasoning budget does not yield the smooth performance gains observed on LLM benchmarks'
  location: Section 1, Figure 1
- claim: 원인은 이산 토큰 추론과 연속 공간 이미지 생성의 모달리티 불일치
  evidence_quote: reasoning is performed in a discrete token space, whereas image generation operates in a continuous latent space
  location: Abstract, Section 1
- claim: GenEval 종합 BAGEL 0.81 → LARC 0.88 (GPT-4o 0.84)
  evidence_quote: LARC achieves state-of-the-art performance on GenEval with a 7%p gain over BAGEL
  location: Abstract, Table 1
- claim: 속성 결합 0.63 → 0.78 (+15%p)
  evidence_quote: The improvement is most pronounced on Attribute Binding, with a +15%p increase over the baseline.
  location: Section 3.1, Table 1
- claim: DPG-Bench 85.07 → 90.04, OneIG-Bench +10.2%p
  evidence_quote: On DPG-Bench, the overall score of LARC improves by +5.8% (85.07 → 90.04) over the base model BAGEL. On OneIG-Bench, LARC yields a +10.2%p gain
  location: Section 3.1, Table 2-3
- claim: MIRA 7.5 → 11.7
  evidence_quote: The most pronounced gain appears on MIRA (7.5 → 11.7)
  location: Section 3.2, Table 5
- claim: 토큰 수준 추론은 MIRA를 7.5 → 7.1로 낮춤
  evidence_quote: Notably, token-level reasoning slightly degrades visual reasoning performance compared to the baseline
  location: Section 3.4, Table 6
- claim: Best-of-10 469.0초 vs LARC L=10 48.0초, L=1 대비 1.2초 추가
  evidence_quote: LARC incurs only a marginal overhead as the number of latent steps increases, requiring additional 1.2 seconds at L = 10 compared to L = 1.
  location: Appendix D.1, Table 11
- claim: 1M interleaved 샘플, A100 8장, Stage 1 약 300 / Stage 2 96 GPU시간
  evidence_quote: All training experiments are conducted with 8× NVIDIA A100s, taking approximately 300 GPU hours in Stage 1 and 96 GPU hours in Stage 2.
  location: Appendix A
- claim: 다양성 보상 없으면 코사인 유사도 0.97로 붕괴, MIRA 11.7 → 9.8
  evidence_quote: removing the diversity reward (λdiv =0) leads to a pairwise cosine similarity of 0.97 across latent steps
  location: Appendix D.2, Table 12
