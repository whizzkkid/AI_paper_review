facts:
- claim: ICLR 2026 Outstanding Paper 수상
  evidence_quote: 'Outstanding Papers: ... LLMs Get Lost In Multi-Turn Conversation, by Philippe Laban, Hiroaki Hayashi, Yingbo Zhou, and Jennifer Neville'
  location: ICLR 공식 블로그 (2026-04-23)
- claim: 15개 LLM, 20만 건 이상의 시뮬레이션 대화
  evidence_quote: We experimented with 15 LLMs, running N = 10 simulations for each pair of model and simulation type, totaling more than 200,000 simulated conversations.
  location: Section 5
- claim: 6개 태스크 평균 39% 하락
  evidence_quote: all the top open- and closed-weight LLMs we test exhibit significantly lower performance in multi-turn conversations than single-turn, with an average drop of 39% across six generation tasks
  location: Abstract
- claim: Concat은 Full의 평균 95.1% 유지
  evidence_quote: CONCAT performance averaging 95.1% of the FULL counterpart
  location: Section 6.1
- claim: GPT-4.1 Sharded/Full 61.8%, Claude 3.7 Sonnet 65.9%, Gemini 2.5 Pro 64.5%
  evidence_quote: The last two columns average the performance drops from the CONCAT and SHARDED compared to the FULL in percentages across the six tasks.
  location: Table 1
- claim: 능력 평균 16% 하락, 불안정성 평균 112% 증가
  evidence_quote: Model aptitude degrades in a non-significant way between the full and sharded settings, with an average drop of 16%. On the other hand, unreliability skyrockets with an average increase of 112%
  location: Section 6.2
- claim: '4가지 원인: 섣부른 답, 이전 답 의존, 가운데 턴 소실, 장황함'
  evidence_quote: We identify four specific causes
  location: Section 6.2, Appendix F
- claim: 새 대화에서 조건을 합쳐 다시 묻기 권고
  evidence_quote: If time allows, try again. ... Consolidate before retrying.
  location: Section 7.4
